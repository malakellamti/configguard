[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configguard"
version = "0.1.0"
description = "A lightweight security auditor for configuration files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ConfigGuard contributors" }
]
dependencies = []

[project.scripts]
configguard = "configguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
